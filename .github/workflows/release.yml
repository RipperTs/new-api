name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-\.][0-9A-Za-z\.\-]+)?$ ]]; then
            echo "Invalid tag: ${tag}"
            echo "Expected: vX.Y.Z (optionally with prerelease/build suffix)"
            exit 1
          fi

      - name: Set version (write VERSION)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/ci/version.sh)"
          echo "${version}" > VERSION
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd web
          pnpm install --frozen-lockfile --ignore-scripts
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$(cat ../VERSION)" pnpm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          mkdir -p dist

          ldflags="-s -w -X one-api/common.Version=${version}"

          build_one() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            local archive_ext="tar.gz"

            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
              archive_ext="zip"
            fi

            local out="new-api_${version}_${goos}_${goarch}${ext}"
            echo "building ${out}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "${ldflags}" -o "dist/${out}" ./main.go

            if [[ "${archive_ext}" == "zip" ]]; then
              (cd dist && zip -q "${out}.zip" "${out}" && rm -f "${out}")
            else
              (cd dist && tar -czf "${out}.tar.gz" "${out}" && rm -f "${out}")
            fi
          }

          build_one linux amd64
          build_one linux arm64
          build_one darwin amd64
          build_one darwin arm64
          build_one windows amd64

          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
